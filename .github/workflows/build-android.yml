name: Build Android APK & Google Play AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions de GitHub

jobs:
  build:
    name: Compilar APK (Pruebas) y AAB (Google Play)
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Instalar dependencias web
        run: npm ci

      - name: Compilar aplicacion web (PWA + React)
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Permisos de ejecucion para Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de depuracion (Para probar en el movil)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Compilar AAB (Android App Bundle para Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Subir APK de prueba como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: gramaticat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Subir AAB sin firmar (requiere firma para Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: gramaticat-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
