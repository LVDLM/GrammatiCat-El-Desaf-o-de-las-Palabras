<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrammatiCat: El Desafío de las Palabras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: #f0f4f8;
            overflow-x: hidden;
            user-select: none;
            transition: background-color 0.8s ease;
        }
        
        /* Efecto Konami: Modo Midnight */
        .konami-active {
            background-color: #020617 !important;
        }
        
        .konami-active .bg-white {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        
        .konami-active .text-indigo-900, 
        .konami-active .text-slate-800,
        .konami-active .text-slate-900 {
            color: #f1f5f9 !important;
        }

        .konami-active .bg-indigo-50 {
            background-color: #1e293b !important;
        }

        .konami-active .border-indigo-100 {
            border-color: #334155 !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Animación de entrada para el modo secreto */
        .konami-unlock-flash {
            animation: flash 0.5s ease-out;
        }
        @keyframes flash {
            0% { filter: brightness(3); }
            100% { filter: brightness(1); }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.3",
        "react/": "https://esm.sh/react@19.2.3/",
        "react-dom": "https://esm.sh/react-dom@19.2.3",
        "react-dom/": "https://esm.sh/react-dom@19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@1.35.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0"
      }
    }
    </script>
</head>
<body class="bg-indigo-50">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
