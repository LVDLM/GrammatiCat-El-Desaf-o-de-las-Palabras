    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: #f0f4f8;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.8s ease;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }
        
        #root {
            height: 100dvh;
            width: 100vw;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .konami-active {
            background-color: #020617 !important;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Orientación Overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #4f46e5;
            color: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        @media screen and (max-width: 900px) and (orientation: portrait) {
            #orientation-overlay {
                display: flex;
            }
        }
        
        /* Ajustes de optimización para landscape móvil (poca altura) */
        @media screen and (max-height: 480px) {
            .hud-container {
                padding: 0.1rem !important;
                margin-bottom: 0.05rem !important;
            }
            .powerup-btn {
                width: 2.8rem !important;
                height: 2.8rem !important;
            }
            .word-bubble {
                padding: 0.25rem 0.6rem !important;
                font-size: 1.4rem !important; /* Aumentado sustancialmente para legibilidad */
            }
            .main-title {
                font-size: 2.5rem !important;
                margin-bottom: 0.5rem !important;
            }
            .menu-btn-container {
                height: 5.5rem !important;
            }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.3",
        "react/": "https://esm.sh/react@19.2.3/",
        "react-dom": "https://esm.sh/react-dom@19.2.3",
        "react-dom/": "https://esm.sh/react-dom@19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@1.35.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0"
      }
    }
    </script>
</head>
<body>
    <div id="orientation-overlay">
        <i class="fas fa-redo fa-3x mb-4 animate-bounce"></i>
        <h2 class="text-2xl font-black italic mb-1 uppercase tracking-tighter">¡Gira tu pantalla!</h2>
        <p class="text-base font-bold opacity-80 mb-6">Para una mejor experiencia, usa el móvil en horizontal.</p>
        
        <button onclick="document.documentElement.requestFullscreen().catch(() => {});" class="px-8 py-4 bg-yellow-400 text-indigo-900 rounded-2xl font-black text-sm uppercase shadow-2xl flex items-center hover:scale-105 active:scale-95 transition-all">
            <i class="fas fa-expand mr-2"></i> Activar Pantalla Completa
        </button>
        <p class="text-[10px] mt-4 opacity-50 uppercase font-black">Actívalo y luego gira el dispositivo</p>
    </div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
